<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>angela's cellar — Gallery labels</title><style>*{box-sizing:border-box}body{margin:0;padding:48px;background:#f6f3ec;color:#2d3329;font-family:"Averia Serif Libre",serif}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #c9c5b9;padding-bottom:22px;margin-bottom:38px}h1{font-size:28px;font-weight:normal;margin:0}a{color:inherit;font:12px Arial}h2{font:12px Arial;letter-spacing:4px;font-weight:normal;margin-top:38px}.labels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}figure{margin:0}canvas{width:100%;height:auto;display:block;box-shadow:0 7px 22px #2a271514}figcaption{font:11px Arial;color:#787b6a;margin-top:12px}@media(max-width:750px){body{padding:24px}.labels{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}h1{font-size:22px}}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400&amp;display=swap"></head><body><header><h1>angela's cellar</h1><a href="../index.html">View the cabinet ↗</a></header><main id="proof"></main><script type="module">
import {createGalleryLabel,galleryCollections} from './gallery-labels.js?v=averia-1';
await document.fonts.load('400 86px "Averia Serif Libre"').catch(()=>{});
for(const {collection,labels} of galleryCollections){const heading=document.createElement('h2');heading.textContent=collection.toUpperCase();document.getElementById('proof').append(heading);const grid=document.createElement('div');grid.className='labels';document.getElementById('proof').append(grid);labels.forEach((lines,i)=>{const figure=document.createElement('figure');const canvas=createGalleryLabel({lines,collection,number:i+1});canvas.setAttribute('role','img');canvas.setAttribute('aria-label',`${collection} ${i+1}: ${lines.join(' ')} — angela's cellar`);figure.append(canvas);const caption=document.createElement('figcaption');caption.textContent=`0${i+1} / ${lines.join(' ')}`;figure.append(caption);grid.append(figure);});}
</script></body></html>
